<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> SUBO PINOY - Filipino Recipes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="hero-banner">
    <div class="hero-content">
      <div class="yellow-sticker">Welcome to</div>
      <div class="yellow-sticker">
        <span class="red-text">SUBO</span> 
        <span class="blue-text">PINOY</span>
      </div>
    </div>
  </header>

  <main class="website-container">

    <div class="search-section">
      <input type="text" id="searchInput" placeholder="Search for a Filipino recipe...">
    </div>
  <div class="category-row">
      <button class="category-btn" data-category="stew"> 🥦 Vegetables</button>
      <button class="category-btn" data-category="chicken">🍗 Chicken</button>
      <button class="category-btn" data-category="pork">🥩 Pork</button>
      <button class="category-btn" data-category="fish">🐟 Fish</button>
      <button class="category-btn" data-category="beef">🐮 Beef</button>
    </div>

    <section id="recipeGrid" class="recipe-grid">

    </section>

  </main>
