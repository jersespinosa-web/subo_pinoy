<head>

  <link rel="stylesheet" href="log_sign_in.css" /><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subo Pinoy - Auth</title>
  <!-- Google Fonts for chunky logo and serif tagline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Modak&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lpg_sign_in.css" />
</head>
<body>
  <div class="phone-frame">
    <!-- Top Blurred Food Header -->
    <header class="hero-section">
      <div class="logo-wrapper">
        <!-- Optional Salakot Hat SVG on the 'P' -->
        <svg class="salakot" viewBox="0 0 100 50">
          <polygon points="50,5 5,42 95,42" fill="#c29b6e" stroke="#5a3e20" stroke-width="3"/>
          <line x1="50" y1="5" x2="30" y2="42" stroke="#5a3e20" stroke-width="2"/>
          <line x1="50" y1="5" x2="70" y2="42" stroke="#5a3e20" stroke-width="2"/>
        </svg>
        <h1 class="logo-top" data-text="SUBO">SUBO</h1>
        <h1 class="logo-bottom" data-text="PINOY">PINOY</h1>
      </div>
      <p class="tagline">“Stories of Unique Bites and Origins.”</p>
    </header>

    <!-- Bottom Brown Section with Banderitas -->
    <main class="form-section">

      <!-- Toggle Switch -->
      <div class="toggle-container" id="authToggle">
        <div class="toggle-slider" id="toggleSlider"></div>
        <button type="button" class="toggle-btn active" id="loginTab">Log in</button>
        <button type="button" class="toggle-btn" id="signinTab">Sign in</button>
      </div>

      <!-- Auth Form -->
      <form id="authForm" class="auth-form">
        <input type="text" id="username" placeholder="Enter username" required />
        <input type="password" id="password" placeholder="Enter password" required />
        <input type="password" id="confirmPassword" class="hidden" placeholder="Confirm password" />

        <button type="submit" class="submit-btn" id="submitBtn">Log in</button>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
</head>
