<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subo Pinoy - Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Modak&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="search_page.css">
</head>
<body>

  <div class="app-screen">
    <header class="hero-banner">
      <img src="images/Welcome to.svg" alt="Welcome to" class="banner-welcome">
      <img src="images/SUBO PINOY.svg" alt="SUBO PINOY" class="banner-logo">
    </header>

    <main class="search-section">
      <div class="search-bar-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search dishes..." autocomplete="off">
        <button type="button" id="clear-btn" class="clear-btn" aria-label="Clear search">×</button>
      </div>

      <div class="filter-pills" id="filter-pills">
        <button class="pill active" data-filter="All">All</button>
        <button class="pill" data-filter="Chicken">Chicken</button>
        <button class="pill" data-filter="Pork">Pork</button>
        <button class="pill" data-filter="Seafood">Seafood</button>
        <button class="pill" data-filter="Easy">Easy</button>
      </div>

      <div class="results-meta" id="results-meta" style="display: none;">
        <span class="meta-badge" id="results-count">0 results</span>
        <button type="button" class="meta-badge" id="sort-btn">Best Match ↓</button>
      </div>

      <ul class="results-list" id="results-list"></ul>
    </main>
  </div>

  <script src="search_page.js"></script>
</body>
</html>
